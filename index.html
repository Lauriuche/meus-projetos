<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lauriuche — Projetos</title>
<meta name="theme-color" content="#030712">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #030712;
    --surface: #0a0f1c;
    --border: rgba(99, 102, 241, 0.12);
    --glow: rgba(99, 102, 241, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: #e2e8f0;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .mesh {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 100% 80% at 20% -10%, rgba(99, 102, 241, 0.18), transparent 50%),
      radial-gradient(ellipse 80% 60% at 90% 10%, rgba(168, 85, 247, 0.12), transparent 45%),
      radial-gradient(ellipse 60% 50% at 50% 100%, rgba(59, 130, 246, 0.08), transparent 50%),
      var(--bg);
  }

  .mesh::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
  }

  .content { position: relative; z-index: 1; }

  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(3, 7, 18, 0.75);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-bottom: 1px solid rgba(99, 102, 241, 0.1);
  }

  .logo-box {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 24px rgba(99, 102, 241, 0.45), inset 0 1px 0 rgba(255,255,255,0.2);
    position: relative;
  }
  .logo-box::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 16px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    opacity: 0.3;
    filter: blur(8px);
    z-index: -1;
  }

  .status-dot {
    width: 11px;
    height: 11px;
    background: #22c55e;
    border-radius: 50%;
    border: 2.5px solid #030712;
    box-shadow: 0 0 8px #22c55e;
    animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { box-shadow: 0 0 6px #22c55e; }
    50% { box-shadow: 0 0 14px #22c55e, 0 0 20px rgba(34,197,94,0.4); }
  }

  .stat-card {
    background: linear-gradient(160deg, rgba(15, 23, 42, 0.9), rgba(10, 15, 28, 0.95));
    border: 1px solid rgba(99, 102, 241, 0.12);
    border-radius: 18px;
    padding: 16px 12px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
  }
  .stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.5), transparent);
  }
  .stat-card:hover {
    border-color: rgba(99, 102, 241, 0.3);
    transform: translateY(-2px);
  }

  .stat-value {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 1.75rem;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .search-wrap { position: relative; }
  .search-wrap input {
    width: 100%;
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid rgba(99, 102, 241, 0.15);
    border-radius: 16px;
    padding: 14px 16px 14px 46px;
    font-size: 14px;
    color: #f1f5f9;
    outline: none;
    transition: all 0.25s;
  }
  .search-wrap input::placeholder { color: #64748b; }
  .search-wrap input:focus {
    border-color: rgba(99, 102, 241, 0.5);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12), 0 0 24px rgba(99, 102, 241, 0.08);
    background: rgba(15, 23, 42, 0.95);
  }

  .pill {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid rgba(71, 85, 105, 0.5);
    background: rgba(15, 23, 42, 0.6);
    color: #94a3b8;
    white-space: nowrap;
    transition: all 0.2s;
    cursor: pointer;
  }
  .pill:hover { border-color: rgba(99, 102, 241, 0.35); color: #cbd5e1; }
  .pill.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border-color: transparent;
    color: white;
    box-shadow: 0 4px 16px -2px rgba(99, 102, 241, 0.5);
  }

  .repo-card {
    background: linear-gradient(165deg, rgba(15, 23, 42, 0.95) 0%, rgba(10, 15, 28, 0.98) 100%);
    border: 1px solid rgba(99, 102, 241, 0.1);
    border-radius: 20px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .repo-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(99,102,241,0.08) 0%, transparent 40%, transparent 100%);
    opacity: 0;
    transition: opacity 0.35s;
    pointer-events: none;
  }
  .repo-card::after {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.4), transparent);
    opacity: 0;
    transition: opacity 0.35s;
  }
  .repo-card:hover {
    transform: translateY(-4px) scale(1.01);
    border-color: rgba(99, 102, 241, 0.35);
    box-shadow:
      0 24px 48px -16px rgba(0, 0, 0, 0.6),
      0 0 0 1px rgba(99, 102, 241, 0.15),
      0 0 40px -10px rgba(99, 102, 241, 0.2);
  }
  .repo-card:hover::before { opacity: 1; }
  .repo-card:hover::after { opacity: 1; }

  .repo-icon {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .repo-icon.has-site {
    background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), rgba(16, 185, 129, 0.1));
    color: #34d399;
    border: 1px solid rgba(52, 211, 153, 0.25);
  }
  .repo-icon.no-site {
    background: linear-gradient(135deg, rgba(71, 85, 105, 0.3), rgba(51, 65, 85, 0.2));
    color: #64748b;
    border: 1px solid rgba(71, 85, 105, 0.3);
  }

  .btn-open {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 600;
    color: white;
    background: linear-gradient(135deg, #6366f1 0%, #7c3aed 50%, #8b5cf6 100%);
    box-shadow: 0 4px 16px -4px rgba(99, 102, 241, 0.55);
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-open::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .btn-open:hover {
    box-shadow: 0 6px 24px -4px rgba(99, 102, 241, 0.7);
    transform: translateY(-1px);
  }
  .btn-open:hover::before { opacity: 1; }
  .btn-open:active { transform: scale(0.97); }

  .btn-code {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: #94a3b8;
    background: rgba(30, 41, 59, 0.5);
    border: 1px solid rgba(71, 85, 105, 0.4);
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn-code:hover {
    background: rgba(51, 65, 85, 0.6);
    color: #e2e8f0;
    border-color: rgba(100, 116, 139, 0.5);
  }

  .btn-disabled {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 16px;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: #475569;
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid rgba(30, 41, 59, 0.6);
  }

  .lang-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    box-shadow: 0 0 0 2px rgba(3, 7, 18, 0.8);
  }

  .skel {
    background: linear-gradient(90deg, #0a0f1c 0%, #111827 40%, #0a0f1c 80%);
    background-size: 200% 100%;
    animation: sk 1.5s ease-in-out infinite;
    border-radius: 20px;
    height: 130px;
  }
  @keyframes sk {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .anim {
    animation: fadeSlide 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    opacity: 0;
  }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }

  .line-clamp-2 {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .title-font { font-family: 'Space Grotesk', sans-serif; }
</style>
</head>
<body>
<div class="mesh"></div>
<div class="content">

  <header>
    <div class="max-w-2xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="relative">
          <div class="logo-box">
            <i class="fab fa-github text-white text-xl"></i>
          </div>
          <div class="status-dot absolute -bottom-0.5 -right-0.5"></div>
        </div>
        <div>
          <h1 class="title-font font-bold text-[17px] text-white tracking-tight leading-none">Projetos</h1>
          <p class="text-[11px] text-slate-500 mt-1 font-medium tracking-wide" id="userInfo">Conectando ao GitHub...</p>
        </div>
      </div>
      <button onclick="loadRepos()" class="w-10 h-10 rounded-xl bg-slate-900/80 border border-indigo-500/20 hover:border-indigo-500/40 flex items-center justify-center text-slate-400 hover:text-indigo-300 transition-all active:scale-90" title="Atualizar">
        <i class="fas fa-sync-alt text-sm" id="refreshIcon"></i>
      </button>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-5 pb-20">

    <div class="grid grid-cols-3 gap-2.5 mb-6">
      <div class="stat-card">
        <div class="stat-value text-transparent bg-clip-text bg-gradient-to-br from-indigo-300 to-indigo-500" id="statRepos">—</div>
        <div class="text-[10px] text-slate-500 font-semibold mt-1.5 tracking-widest uppercase">Repos</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-transparent bg-clip-text bg-gradient-to-br from-emerald-300 to-teal-500" id="statPages">—</div>
        <div class="text-[10px] text-slate-500 font-semibold mt-1.5 tracking-widest uppercase">Sites</div>
      </div>
      <div class="stat-card">
        <div class="stat-value text-transparent bg-clip-text bg-gradient-to-br from-amber-300 to-orange-500" id="statStars">—</div>
        <div class="text-[10px] text-slate-500 font-semibold mt-1.5 tracking-widest uppercase">Stars</div>
      </div>
    </div>

    <div class="search-wrap mb-4">
      <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm pointer-events-none"></i>
      <input type="text" id="searchInput" placeholder="Buscar projeto..." oninput="filterRepos()">
    </div>

    <div class="flex gap-2 mb-5 overflow-x-auto pb-1" style="scrollbar-width:none">
      <button class="pill active" data-filter="all" onclick="setFilter('all')">Todos</button>
      <button class="pill" data-filter="pages" onclick="setFilter('pages')"><i class="fas fa-globe text-[10px] mr-1.5 opacity-70"></i>Com Site</button>
      <button class="pill" data-filter="html" onclick="setFilter('html')">HTML</button>
      <button class="pill" data-filter="js" onclick="setFilter('js')">JavaScript</button>
    </div>

    <div id="loading" class="space-y-3">
      <div class="skel"></div>
      <div class="skel" style="animation-delay:0.1s"></div>
      <div class="skel" style="animation-delay:0.2s"></div>
      <div class="skel" style="animation-delay:0.3s"></div>
    </div>

    <div id="error" class="hidden text-center py-20">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center">
        <i class="fas fa-bolt text-2xl text-amber-400"></i>
      </div>
      <p class="text-slate-200 font-semibold mb-1" id="errorMsg">Falha na conexão</p>
      <p class="text-sm text-slate-500 mb-6">Não foi possível carregar os projetos</p>
      <button onclick="loadRepos()" class="btn-open inline-flex px-8">Tentar novamente</button>
    </div>

    <div id="repoList" class="space-y-3 hidden"></div>

    <div id="empty" class="hidden text-center py-20">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center">
        <i class="fas fa-inbox text-2xl text-slate-600"></i>
      </div>
      <p class="text-slate-300 font-medium">Nada encontrado</p>
      <p class="text-sm text-slate-600 mt-1">Tente outro filtro</p>
    </div>
  </main>

  <footer class="text-center text-[11px] text-slate-700 pb-10 tracking-wide">
    <span class="inline-flex items-center gap-2">
      <i class="fab fa-github opacity-50"></i>
      GitHub API · Lauriuche
    </span>
  </footer>
</div>

<script>
const USERNAME = 'Lauriuche';
let allRepos = [];
let currentFilter = 'all';

const LANG_COLORS = {
  HTML: '#e34c26', JavaScript: '#f1e05a', TypeScript: '#3178c6',
  CSS: '#563d7c', Python: '#3572A5', Java: '#b07219',
  PHP: '#4F5D95', Shell: '#89e051', default: '#64748b'
};

async function loadRepos() {
  const icon = document.getElementById('refreshIcon');
  icon.classList.add('fa-spin');
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('repoList').classList.add('hidden');
  document.getElementById('error').classList.add('hidden');
  document.getElementById('empty').classList.add('hidden');

  try {
    const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?per_page=100&sort=updated`);
    if (!res.ok) {
      if (res.status === 403) throw new Error('Limite da API. Aguarde alguns minutos.');
      throw new Error(`Erro ${res.status}`);
    }
    allRepos = await res.json();
    allRepos.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

    document.getElementById('statRepos').textContent = allRepos.length;
    document.getElementById('statPages').textContent = allRepos.filter(r => r.has_pages || (r.homepage && r.homepage.startsWith('http'))).length;
    document.getElementById('statStars').textContent = allRepos.reduce((s, r) => s + r.stargazers_count, 0);
    document.getElementById('userInfo').textContent = `@${USERNAME} · ${allRepos.length} projetos`;

    renderRepos();
  } catch (err) {
    document.getElementById('error').classList.remove('hidden');
    document.getElementById('errorMsg').textContent = err.message || 'Falha ao conectar';
  } finally {
    document.getElementById('loading').classList.add('hidden');
    icon.classList.remove('fa-spin');
  }
}

function getSiteUrl(repo) {
  if (repo.homepage && repo.homepage.startsWith('http')) return repo.homepage;
  if (repo.has_pages) return `https://${USERNAME.toLowerCase()}.github.io/${repo.name}/`;
  return null;
}

function formatDate(dateStr) {
  const d = new Date(dateStr);
  const diff = (Date.now() - d) / 1000;
  if (diff < 3600) return 'Agora';
  if (diff < 86400) return `${Math.floor(diff/3600)}h atrás`;
  if (diff < 604800) return `${Math.floor(diff/86400)}d atrás`;
  if (diff < 2592000) return `${Math.floor(diff/604800)} sem atrás`;
  return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
}

function renderRepos() {
  const list = document.getElementById('repoList');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = allRepos.filter(repo => {
    if (search && !repo.name.toLowerCase().includes(search) && !(repo.description || '').toLowerCase().includes(search)) return false;
    if (currentFilter === 'pages') return repo.has_pages || (repo.homepage && repo.homepage.startsWith('http'));
    if (currentFilter === 'html') return repo.language === 'HTML';
    if (currentFilter === 'js') return repo.language === 'JavaScript';
    return true;
  });

  if (!filtered.length) {
    list.classList.add('hidden');
    document.getElementById('empty').classList.remove('hidden');
    return;
  }

  document.getElementById('empty').classList.add('hidden');
  list.classList.remove('hidden');

  list.innerHTML = filtered.map((repo, i) => {
    const siteUrl = getSiteUrl(repo);
    const langColor = LANG_COLORS[repo.language] || LANG_COLORS.default;
    const hasSite = !!siteUrl;
    const delay = Math.min(i * 50, 400);

    return `
    <article class="repo-card anim" style="animation-delay:${delay}ms">
      <div class="flex items-start gap-3.5">
        <div class="repo-icon ${hasSite ? 'has-site' : 'no-site'}">
          <i class="fas fa-${hasSite ? 'globe' : 'code'}"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <h3 class="title-font font-semibold text-[15px] text-white truncate tracking-tight">${repo.name}</h3>
            ${repo.private ? '<span class="text-[9px] font-bold tracking-wider bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded-md border border-amber-500/20">PRIV</span>' : ''}
          </div>
          <p class="text-[12.5px] text-slate-400 line-clamp-2 leading-relaxed mb-2.5">${repo.description || '<span class="italic text-slate-600">Sem descrição</span>'}</p>
          <div class="flex items-center gap-3 text-[11px] text-slate-500">
            ${repo.language ? `<span class="flex items-center gap-1.5 font-medium"><span class="lang-dot" style="background:${langColor}"></span>${repo.language}</span>` : ''}
            <span class="flex items-center gap-1"><i class="far fa-clock text-[10px] opacity-60"></i>${formatDate(repo.updated_at)}</span>
            ${repo.stargazers_count > 0 ? `<span class="flex items-center gap-1 text-amber-400/80"><i class="fas fa-star text-[9px]"></i>${repo.stargazers_count}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="flex gap-2 mt-4">
        ${hasSite
          ? `<a href="${siteUrl}" target="_blank" rel="noopener" class="btn-open"><i class="fas fa-arrow-up-right-from-square text-[11px]"></i>Abrir Site</a>`
          : `<div class="btn-disabled"><i class="fas fa-ban text-[11px] opacity-40"></i>Sem site</div>`
        }
        <a href="${repo.html_url}" target="_blank" rel="noopener" class="btn-code"><i class="fab fa-github"></i>Código</a>
      </div>
    </article>`;
  }).join('');
}

function filterRepos() { renderRepos(); }

function setFilter(filter) {
  currentFilter = filter;
  document.querySelectorAll('.pill').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  renderRepos();
}

loadRepos();
</script>
</body>
</html>
